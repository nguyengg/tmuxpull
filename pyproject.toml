[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tmuxpull"
version = "0.1.1"
description = "Concurrent git pull --rebase --autostash across multiple repos with tmux attention windows"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Henry Nguyen", email = "5065089+nguyengg@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
keywords = ["git", "tmux", "rebase", "concurrent", "automation"]
requires-python = ">=3.11"
dependencies = [
    "libtmux>=0.35",
]

[project.urls]
Homepage = "https://github.com/nguyengg/tmuxpull"
Repository = "https://github.com/nguyengg/tmuxpull.git"
Issues = "https://github.com/nguyengg/tmuxpull/issues"

[project.scripts]
tmuxpull = "tmuxpull.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tmuxpull"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"] # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]