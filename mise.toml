[tools]
python = "3.12"
uv = "latest"

# No [env] PYTHONPATH here on purpose. `uv sync` installs the project editable
# into .venv, so `uv run tmuxpull` and `uv run pytest` already import from src/.
# Exporting PYTHONPATH=src additionally made every python process started in
# this directory prefer the working tree -- including a globally installed
# tmuxpull, which then silently ran whatever was checked out here instead of the
# released code.

[tasks.install]
description = "Install dependencies for development"
run = "uv sync --dev"

[tasks.test]
description = "Run tests with pytest"
run = "uv run pytest"

[tasks.lint]
description = "Run linting with ruff"
run = "uv run ruff check ."

[tasks.format]
description = "Format code with ruff"
run = "uv run ruff format ."

[tasks.build]
description = "Build package"
run = "uv build"

[tasks.gen-script]
description = "Regenerate bin/rebase-all.py from src/tmuxpull/__init__.py"
run = "python scripts/gen_script.py"

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf dist/", "rm -rf src/tmuxpull.egg-info/"]